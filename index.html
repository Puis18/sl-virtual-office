<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Virtual Office</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1E3365;--navy2:#14244A;--red:#9F1C33;--green:#126C3D;--ink:#121B2E;--sub:#3D4760;--muted:#5A6478;--line:#DCE1EA;--bg:#F3F5F9}
  *{box-sizing:border-box} body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  header{background:#fff;border-bottom:4px solid var(--red)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
  header img{height:30px;display:block}
  .who{display:flex;align-items:center;gap:10px}
  .who .t{display:flex;flex-direction:column;line-height:1.3;text-align:right}
  .who b{font-size:14px} .who small{font-size:12px;color:var(--muted)}
  .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
  .av img{width:100%;height:100%;object-fit:cover}
  .hero{background:var(--navy);color:#fff}
  .hero .wrap{padding-top:28px;padding-bottom:32px;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center}
  .hero .l{flex:999 1 420px;min-width:0}
  .hero small{color:#AEBBD6;font-size:13px} .hero h1{margin:6px 0 8px;font-size:28px;line-height:1.3}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
  .goal{flex:1 1 320px;min-width:0;background:#fff;color:var(--ink);border-radius:12px;padding:20px 22px}
  .goal .h{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:600}
  .goal .v{font-family:Inter,sans-serif;font-size:40px;font-weight:700;color:var(--navy);margin:8px 0}
  .bar{height:8px;border-radius:4px;background:#E3E8F0}
  .goal p{margin:10px 0 0;font-size:12px;color:var(--muted)}
  main.wrap{padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:28px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi span{font-size:13px;color:var(--sub)} .kpi b{display:block;font-family:Inter,sans-serif;font-size:24px;margin-top:4px;color:var(--muted)}
  .sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
  .sec-h h2{margin:0;font-size:20px;color:var(--navy);padding-left:12px;border-left:4px solid var(--red)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .dept{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border-radius:12px;min-height:150px;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line)}
  .dept.open{border:1.5px solid var(--navy);box-shadow:inset 0 4px 0 var(--green)}
  .dept.locked{background:#EEF1F5;border:1px dashed #AEB6C5;color:var(--muted)}
  .dept .top{display:flex;justify-content:space-between;align-items:center;width:100%}
  .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:#E3E8F0;color:var(--sub)}
  .open .ic{background:var(--navy);color:#fff}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;background:#E8ECF2;color:var(--sub)}
  .open .badge{background:#E3F1E8;color:#0C4F2C;font-weight:600}
  .locked .badge{background:transparent;border:1px solid #AEB6C5;color:#4F586B}
  .dept b{font-size:16px} .dept small{font-size:13px;color:var(--sub);line-height:1.55}
  .msg{margin:14px 0 0;padding:12px 16px;border:1px solid #C9D4E8;border-radius:10px;background:#EEF2F9;color:var(--navy);font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px}
  .card .hd{padding:14px 20px;border-bottom:1px solid #E6EAF1;display:flex;justify-content:space-between;align-items:center}
  .card .hd h2{margin:0;font-size:17px}
  .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #EEF1F5}
  .row small{display:block;color:var(--muted);font-size:13px}
  .btn{min-height:42px;padding:0 16px;border:none;border-radius:8px;font-weight:600}
  .ok{background:var(--green);color:#fff} .no{background:#E8ECF2;color:var(--ink)}
  .primary{background:var(--red);color:#fff;width:100%;min-height:48px;margin-top:12px}
  .empty{padding:16px 20px;color:var(--muted);font-size:14px;margin:0}
  .single{max-width:480px;margin:24px auto;padding:22px}
  .single h1{font-size:22px;margin:0 0 8px} .single p{color:var(--muted);line-height:1.6;margin:0 0 14px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;min-height:48px;padding:0 12px;border:1px solid #C5CED8;border-radius:8px;font:inherit;font-size:16px}
  .err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
  .skel{height:120px;border-radius:12px;background:linear-gradient(90deg,#E8ECF2,#F3F5F9,#E8ECF2);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .back{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;min-height:40px;padding:0 14px;margin-bottom:10px;font-size:14px}
  .days{display:flex;align-items:flex-end;gap:4px;height:160px;padding:16px 20px 8px;overflow-x:auto}
  .db{flex:1 0 14px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  
  .db span{font-size:10px;color:var(--muted)}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #EEF1F5;vertical-align:middle}
  td small{display:block;color:var(--muted);font-size:12px;max-width:min(260px,38vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n{text-align:right;font-family:Inter,sans-serif;white-space:nowrap}
  .pc{display:flex;align-items:center;gap:8px;min-width:120px}
  .mini{flex:1;height:6px;border-radius:3px;background:#E3E8F0;overflow:hidden}.mini i{display:block;height:6px}
  .pc span{font-family:Inter,sans-serif;font-size:13px;width:40px;text-align:right}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-top:14px;padding-bottom:0;border-bottom:1px solid var(--line)}
  .tabs button{background:transparent;border:none;padding:10px 14px;min-height:44px;font-size:15px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
  .tabs button[aria-selected=true]{color:var(--navy);font-weight:700;border-bottom-color:var(--red)}
  .stk{width:100%;display:flex;flex-direction:column;border-radius:3px 3px 0 0;overflow:hidden}.stk i{display:block;width:100%}
  .ios{background:var(--navy)}.and{background:#3E9A6A}.oth{background:#B4BCC9}
  .osbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#E3E8F0;flex:1}.osbar i{display:block;height:10px}
  .osc{display:flex;align-items:center;gap:8px;min-width:130px}.osc span{font-family:Inter,sans-serif;font-size:13px;width:40px;text-align:right}
  .lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .kpi .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  tr.click{cursor:pointer} tr.click:hover td{background:#F6F8FB}
  .ext{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 16px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:0;text-decoration:none;color:var(--ink)}
  .ext b{display:block;font-size:15px;color:var(--navy)} .ext small{display:block;font-size:12px;color:var(--muted)} .ext span:last-child{font-size:20px;color:var(--navy)}
  footer{border-top:1px solid var(--line);background:#fff;font-size:12px;color:var(--muted)}
  footer .wrap{padding:14px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
  @media (max-width:560px){.hero h1{font-size:23px}.who .t{display:none}}
</style>
</head>
<body>
<header><div class="wrap"><img src="logo.png" alt="S Leasing"><div class="who" id="who"></div></div></header>
<div id="app"><main class="wrap"><div class="skel"></div><div class="skel"></div></main></div>
<footer><div class="wrap"><span>S Leasing Virtual Office · เครื่องมือภายในทีม AM1 / AM2</span><span>ข้อมูลลูกค้าเป็นความลับ ห้ามเผยแพร่ภายนอก (PDPA)</span></div></footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012282702-qtqjFxgj';
const API_URL = 'https://script.google.com/macros/s/AKfycbyXqPr50rBusW9Z-t0P4hk9ZshyvW_sA4vAn4IfmdqPiHizOpofBO3-7dSOwkKMQbpa/exec';

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action, extra = {}) {
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, extra)) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error); return j;
}
const MSG = {
  EMP_NOT_FOUND:'ไม่พบรหัสพนักงานนี้ กรุณาตรวจสอบอีกครั้ง', EMP_ALREADY_LINKED:'รหัสนี้ถูกผูกกับ LINE อื่นแล้ว กรุณาติดต่อผู้ดูแลระบบ',
  ALREADY_LINKED:'LINE นี้ลงทะเบียนไว้แล้ว', INVALID_TOKEN:'การยืนยันตัวตนหมดอายุ กรุณาปิดแล้วเปิดใหม่', FORBIDDEN:'คุณไม่มีสิทธิ์ทำรายการนี้'
};
const say = e => MSG[e.message] || ('เกิดข้อผิดพลาด: ' + e.message);

/* ---------- ระดับสิทธิ์: ใช้สิทธิ์ที่กว้างที่สุดที่คนนั้นมี ---------- */
const RANK = { SELF:1, TEAM:2, HUB:3, AM:4, ALL:5 };
const ROLE_TH = { CK:'CK', BK:'BK', AG:'AG', TM:'TM', HRM:'Hub RM', AM:'AM', DIR:'ผู้อำนวยการ' };
function roleLabel(r) {
  const where = r.scope==='ALL' ? 'ทั้งหมด' : r.scope==='AM' ? 'ทุกทีมใน '+r.am : r.scope==='HUB' ? 'ทุกทีมใน '+r.hub
              : r.scope==='TEAM' ? 'ทีม '+r.team : 'ข้อมูลของตัวเอง';
  return (ROLE_TH[r.role] || r.role) + ' · ' + where;
}

/* ---------- แผนก (การ์ดแบบ A บนโครง C) ---------- */
const DEPTS = [
  { mk:'ข', name:'ฝ่ายขาย', desc:'Dashboard Daily · Dealer Monthly · อันดับทีม', phase:1, min:'SELF' },
  { mk:'ห', name:'ฝ่ายติดตามหนี้', desc:'OD Dashboard · Collection Follow-up', phase:1, min:'SELF' },
  { mk:'D', name:'ฝ่ายพัฒนา Dealer', desc:'TM Field Visit · Hub RM Calendar · Showroom', phase:2, min:'SELF' },
  { mk:'P', name:'ฝ่ายโปรดักต์', desc:'นโยบาย Dealer · เงื่อนไข MO / EA · โบรชัวร์', phase:2, min:'SELF' },
  { mk:'H', name:'ฝ่ายทรัพยากรบุคคล', desc:'ผังทีม · คู่มือพนักงานใหม่ · แบบทดสอบ', phase:2, min:'SELF' },
  { mk:'ธ', name:'ฝ่ายธุรการ', desc:'File Merger · คลังอีเมล · แบบฟอร์ม', phase:2, min:'TEAM' },
  { mk:'M', name:'ฝ่าย MIS', desc:'ผู้ใช้และสิทธิ์ · สถานะข้อมูล · แจ้งปัญหา', phase:2, min:'ALL' },
  { mk:'ผ', name:'สำนักผู้อำนวยการ', desc:'ภาพรวม AM1 / AM2 · เป้าหมาย · นโยบาย', phase:2, min:'ALL' }
];
const KPI = {
  SELF:['ยอดอนุมัติของฉันวันนี้','ลูกค้า OD ที่ต้องโทร','นัดที่ครบกำหนดวันนี้'],
  TEAM:['ยอดอนุมัติทีมวันนี้','OD ของทีม','Dealer ที่ต้องเยี่ยม'],
  HUB:['ยอดอนุมัติ HUB วันนี้','OD ของ HUB','ทีมต่ำกว่าเป้า'],
  AM:['ยอดอนุมัติรวมวันนี้','อัตรา OD รวม','ทีมต่ำกว่าเป้า'],
  ALL:['ยอดอนุมัติ AM1 + AM2 วันนี้','อัตรา OD AM1 / AM2','ผู้ใช้รออนุมัติสิทธิ์']
};

function thaiDate() {
  return new Date().toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

let ME, PROFILE, SALES;
function viewLobby(me, profile) {
  ME = me; PROFILE = profile; window.scrollTo(0, 0);
  const top = me.roles.reduce((a, r) => RANK[r.scope] > RANK[a] ? r.scope : a, 'SELF');
  const name = me.nick || me.name;
  document.getElementById('who').innerHTML = `<div class="t"><b>${esc(me.name)}</b><small>${esc(me.roles.map(r=>ROLE_TH[r.role]||r.role).join(' / '))}</small></div>
    <div class="av">${profile && profile.pictureUrl ? `<img src="${esc(profile.pictureUrl)}" alt="">` : esc(String(name).charAt(0))}</div>`;

  const cards = DEPTS.map((d, i) => {
    const allowed = RANK[top] >= RANK[d.min];
    const cls = !allowed ? 'locked' : d.phase === 1 ? 'open' : '';
    const st = !allowed ? 'ไม่มีสิทธิ์' : d.phase === 1 ? 'เปิดใช้งาน' : 'เฟส 2';
    return `<button class="dept ${cls}" data-i="${i}" data-st="${st}"><div class="top"><div class="ic">${d.mk}</div><span class="badge">${st}</span></div>
      <b>${d.name}</b><small>${d.desc}</small></button>`;
  }).join('');

  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <div class="l"><small>${esc(thaiDate())}</small>
      <h1>สวัสดี คุณ${esc(name)}</h1>
      <div class="chips">${me.roles.map(r => `<span class="chip">${esc(roleLabel(r))}</span>`).join('')}</div></div>
    <div class="goal"><div class="h"><span>ยอดสะสมเทียบเป้า</span><span>เดือนนี้</span></div>
      <div class="v" id="gv">…</div><div class="bar"><div id="gb" style="height:8px;border-radius:4px;background:var(--green);width:0"></div></div><p id="gp">กำลังโหลดยอดขาย…</p></div>
  </div></section>
  <main class="wrap">
    <section class="kpis" aria-label="ตัวเลขสำคัญ">${KPI[top].map((k,i) => `<div class="kpi"><span>${k}</span><b id="k${i}">—</b></div>`).join('')}</section>
    <section><div class="sec-h"><h2>แผนกในออฟฟิศ</h2>
      <div class="legend"><span><i style="background:var(--green)"></i>เปิดใช้งาน</span><span><i style="background:#9AA4B6"></i>เฟส 2</span><span><i style="border:1.5px solid #9AA4B6"></i>ไม่มีสิทธิ์</span></div></div>
      <div class="grid">${cards}</div><div id="dmsg"></div></section>
    <section id="admin"></section>
  </main>`;

  app.querySelectorAll('.dept').forEach(b => b.onclick = () => {
    const d = DEPTS[b.dataset.i], st = b.dataset.st;
    if (b.dataset.i === '0' && st === 'เปิดใช้งาน') { viewSales(); return; }
    const t = st === 'ไม่มีสิทธิ์' ? d.name + ' ไม่อยู่ในสิทธิ์ของตำแหน่งคุณ'
            : st === 'เฟส 2' ? d.name + ' จะเปิดใช้ในเฟส 2'
            : d.name + ' กำลังสร้าง จะเปิดให้ใช้เร็ว ๆ นี้';
    document.getElementById('dmsg').innerHTML = `<p class="msg" role="status">${esc(t)}</p>`;
  });
  if (top === 'ALL') loadPending();
  loadSales(top);
}

/* ================= ฝ่ายขาย ================= */
const nf = n => Number(n || 0).toLocaleString('th-TH');
const mb = n => (Number(n || 0) / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' ลบ.';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const thDay = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '—';
const thMonth = m => m ? new Date(m + '-01T00:00:00').toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }) : '';
const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };

async function loadSales(top) {
  try {
    SALES = SALES || await api('sales');
    const s = SALES, p = pct(s.mtd.apps, s.target);
    set('gv', nf(s.mtd.apps) + ' / ' + nf(s.target) + ' เคส');
    const gb = document.getElementById('gb'); if (gb) gb.style.width = Math.min(p, 100) + '%';
    set('gp', `${p}% ของเป้า ${thMonth(s.month)} · ข้อมูลถึง ${thDay(s.latest)}`);
    set('k0', nf(s.today.apps) + ' เคส');
    if (top === 'HUB' || top === 'AM') set('k2', s.teams.filter(t => t.apps < t.target).length + ' ทีม');
  } catch (e) { set('gv', '—'); set('gp', 'ยังไม่มีข้อมูลยอดขาย'); }
}

let SALES_TAB = 'overview', SALES_TEAM = '';
const osBar = (ios, and, oth) => {
  const t = ios + and + oth || 1;
  return `<div class="osbar"><i class="ios" style="width:${ios / t * 100}%"></i><i class="and" style="width:${and / t * 100}%"></i><i class="oth" style="width:${oth / t * 100}%"></i></div>`;
};
const pctTxt = (a, t) => t ? Math.round(a / t * 100) + '%' : '—';

function viewSales() {
  const s = SALES;
  if (!s) { document.getElementById('dmsg').innerHTML = '<p class="msg">กำลังโหลดยอดขาย ลองกดอีกครั้ง</p>'; return; }
  window.scrollTo(0, 0);
  const p = pct(s.mtd.apps, s.target);
  const tabs = [['overview', 'ภาพรวม'], ['people', s.scope === 'SELF' ? 'ยอดของฉัน' : 'ทีม / พนักงาน'], ['os', 'iOS vs Android'], ['shops', 'ร้านค้า']];
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <div class="l"><button class="back" id="back">← กลับล็อบบี้</button>
      <h1>ฝ่ายขาย</h1><small>ยอด ${esc(thMonth(s.month))} · ข้อมูลถึง ${esc(thDay(s.latest))} · ขอบเขต: ${esc(s.scope === 'SELF' ? 'ยอดของคุณ' : s.scope)}</small></div>
    <div class="goal"><div class="h"><span>ยอดสะสมเทียบเป้า</span><span>${p}%</span></div>
      <div class="v">${nf(s.mtd.apps)} <span style="font-size:18px;color:var(--muted)">/ ${nf(s.target)} เคส</span></div>
      <div class="bar"><div style="height:8px;border-radius:4px;background:var(--green);width:${Math.min(p, 100)}%"></div></div>
      <p>เป้า ${s.scope === 'SELF' ? '30 เคส/คน' : '500 เคส/ทีม'} ต่อเดือน</p></div>
  </div></section>
  <div class="wrap" style="padding-top:14px"><a class="ext" href="https://puis18.github.io/sleasing-dashboard/" target="_blank" rel="noopener">
    <span><b>เปิด Dashboard Daily</b><small>ดูรายละเอียดเชิงลึกทุกมุมมอง (แสดงทุกทีม ไม่ได้คัดตามสิทธิ์)</small></span><span aria-hidden="true">↗</span></a></div>
  <nav class="tabs wrap" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === SALES_TAB}" data-t="${k}">${l}</button>`).join('')}</nav>
  <main class="wrap" id="tab"></main>`;
  document.getElementById('back').onclick = () => viewLobby(ME, PROFILE);
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { SALES_TAB = b.dataset.t; viewSales(); });
  const box = document.getElementById('tab');
  box.innerHTML = ({ overview: tabOverview, people: tabPeople, os: tabOS, shops: tabShops })[SALES_TAB](s);
  box.querySelectorAll('tr[data-team]').forEach(tr => tr.onclick = () => { SALES_TEAM = tr.dataset.team; SALES_TAB = 'people'; viewSales(); });
  const clr = document.getElementById('clr'); if (clr) clr.onclick = () => { SALES_TEAM = ''; viewSales(); };
}

function tabOverview(s) {
  const max = Math.max(1, ...s.daily.map(d => d[1] + d[2] + d[3]));
  const bars = s.daily.map(([d, i, a, o]) => `<div class="db" title="${esc(thDay(d))}: ${nf(i + a + o)} เคส (iOS ${nf(i)} · Android ${nf(a)})">
    <div class="stk" style="height:${Math.max(2, (i + a + o) / max * 100)}%"><i class="oth" style="flex:${o}"></i><i class="and" style="flex:${a}"></i><i class="ios" style="flex:${i}"></i></div><span>${+d.slice(8)}</span></div>`).join('');
  return `
  <section class="kpis">
    <div class="kpi"><span>เคสวันล่าสุด (${esc(thDay(s.latest))})</span><b style="color:var(--ink)">${nf(s.today.apps)}</b></div>
    <div class="kpi"><span>ยอดจัดวันล่าสุด</span><b style="color:var(--ink)">${mb(s.today.amt)}</b></div>
    <div class="kpi"><span>ยอดจัดสะสมเดือนนี้</span><b style="color:var(--ink)">${mb(s.mtd.amt)}</b></div>
    <div class="kpi"><span>สัดส่วน iOS</span><b style="color:var(--ink)">${pctTxt(s.mtd.ios, s.mtd.apps)}</b></div>
  </section>
  <section class="card"><div class="hd"><h2>จำนวนเคสรายวัน</h2><div class="legend"><span><i class="lg ios"></i>iOS</span><span><i class="lg and"></i>Android</span></div></div>
    <div class="days">${bars || '<p class="empty">ยังไม่มีข้อมูล</p>'}</div></section>
  ${s.teams.length ? teamTable(s.teams.slice(0, 10), 'ทีมสูงสุด 10 อันดับ (กดที่ทีมเพื่อดูพนักงาน)') : ''}`;
}

function teamTable(list, title) {
  const rows = list.map((t, i) => {
    const tp = pct(t.apps, t.target);
    return `<tr data-team="${esc(t.code)}" class="click"><td>${i + 1}</td><td><b>${esc(t.code)}</b><small>${esc(t.name)}</small></td>
      <td class="n">${nf(t.today)}</td><td class="n">${nf(t.apps)}</td><td class="n">${nf(t.emp)} / ${nf(t.dlr)}</td>
      <td class="pc"><div class="mini"><i style="width:${Math.min(tp, 100)}%;background:${tp >= 100 ? 'var(--green)' : tp >= 70 ? 'var(--navy)' : 'var(--red)'}"></i></div><span>${tp}%</span></td></tr>`;
  }).join('');
  return `<section class="card"><div class="hd"><h2>${title}</h2></div><div class="tw"><table>
    <thead><tr><th>#</th><th>ทีม</th><th class="n">วันล่าสุด</th><th class="n">สะสม</th><th class="n">พนักงาน / ร้าน</th><th>เทียบเป้า</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function tabPeople(s) {
  const staff = s.staff.filter(x => !SALES_TEAM || x.team === SALES_TEAM);
  const rows = staff.map((x, i) => `<tr><td>${i + 1}</td><td><b>${esc(x.name)}</b><small>${esc(x.team)}</small></td>
    <td class="n">${nf(x.today)}</td><td class="n">${nf(x.apps)}</td><td class="n">${nf(x.ios)} / ${nf(x.android)}</td><td class="n">${pct(x.apps, 30)}%</td></tr>`).join('');
  const t = SALES_TEAM && s.teams.find(x => x.code === SALES_TEAM);
  return `${!SALES_TEAM && s.teams.length ? teamTable(s.teams, `ทุกทีม (${s.teams.length})`) : ''}
  <section class="card"><div class="hd"><h2>${SALES_TEAM ? 'พนักงานทีม ' + esc(SALES_TEAM) : s.scope === 'SELF' ? 'ยอดของฉัน' : 'อันดับพนักงาน'}</h2>
    ${SALES_TEAM ? '<button class="btn no" id="clr">ดูทุกทีม</button>' : ''}</div>
    ${t ? `<p class="empty">${esc(t.name)} · ทีมสะสม ${nf(t.apps)} เคส (พนักงาน ${nf(t.emp)} · ร้านทำเอง ${nf(t.dlr)})</p>` : ''}
    <div class="tw"><table><thead><tr><th>#</th><th>พนักงาน</th><th class="n">วันล่าสุด</th><th class="n">สะสม</th><th class="n">iOS / Android</th><th class="n">เทียบเป้า</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="empty">ไม่พบยอดในเดือนนี้</td></tr>'}</tbody></table></div>
    <p class="empty">นับเฉพาะเคสที่บันทึกในชื่อพนักงาน · เป้า 30 เคส/คน/เดือน</p></section>`;
}

function tabOS(s) {
  const m = s.mtd, tot = m.ios + m.android + m.other;
  const rows = (s.teams.length ? s.teams : []).slice().sort((a, b) => b.ios / (b.apps || 1) - a.ios / (a.apps || 1)).map(t => `<tr data-team="${esc(t.code)}" class="click">
    <td><b>${esc(t.code)}</b><small>${esc(t.name)}</small></td><td class="n">${nf(t.ios)}</td><td class="n">${nf(t.android)}</td>
    <td class="osc">${osBar(t.ios, t.android, t.other)}<span>${pctTxt(t.ios, t.apps)}</span></td></tr>`).join('');
  return `
  <section class="kpis">
    <div class="kpi"><span>iOS (Apple)</span><b style="color:var(--navy)">${nf(m.ios)}</b><small class="sub">${pctTxt(m.ios, tot)} ของเคสทั้งหมด</small></div>
    <div class="kpi"><span>Android</span><b style="color:var(--green)">${nf(m.android)}</b><small class="sub">${pctTxt(m.android, tot)} ของเคสทั้งหมด</small></div>
    ${m.other ? `<div class="kpi"><span>อื่น ๆ (ไม่ใช่มือถือ)</span><b style="color:var(--ink)">${nf(m.other)}</b><small class="sub">${pctTxt(m.other, tot)}</small></div>` : ''}
  </section>
  <section class="card"><div class="hd"><h2>สัดส่วนรวม</h2><div class="legend"><span><i class="lg ios"></i>iOS</span><span><i class="lg and"></i>Android</span></div></div>
    <div style="padding:16px 20px">${osBar(m.ios, m.android, m.other)}</div></section>
  ${rows ? `<section class="card"><div class="hd"><h2>รายทีม (เรียงตามสัดส่วน iOS)</h2></div><div class="tw"><table>
    <thead><tr><th>ทีม</th><th class="n">iOS</th><th class="n">Android</th><th>สัดส่วน iOS</th></tr></thead><tbody>${rows}</tbody></table></div></section>` : ''}`;
}

function tabShops(s) {
  const rows = s.shops.map((x, i) => `<tr><td>${i + 1}</td><td><b>${esc(x.shop)}</b><small>${esc(x.team)}</small></td>
    <td class="n">${nf(x.today)}</td><td class="n">${nf(x.apps)}</td><td class="n">${mb(x.amt)}</td><td class="osc">${osBar(x.ios, x.android, x.other)}<span>${pctTxt(x.ios, x.apps)}</span></td></tr>`).join('');
  return `<section class="card"><div class="hd"><h2>ร้านที่มียอดสูงสุด ${s.shops.length} อันดับ</h2></div><div class="tw"><table>
    <thead><tr><th>#</th><th>ร้าน · สาขา</th><th class="n">วันล่าสุด</th><th class="n">สะสม</th><th class="n">ยอดจัด</th><th>iOS</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="empty">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div></section>`;
}

async function loadPending() {
  const box = document.getElementById('admin');
  try {
    const { list } = await api('pending');
    box.innerHTML = `<div class="card"><div class="hd"><h2>คำขอรออนุมัติ (${list.length})</h2></div>
      ${list.length ? '<p class="empty">ตรวจว่าชื่อ LINE ตรงกับเจ้าของรหัสพนักงานก่อนกดอนุมัติ</p>' : ''}
      ${list.map(x => `<div class="row"><div><b>${esc(x.name)}</b> (${esc(x.nick)})
        <small>${esc(x.emp)} · ${esc(x.pos)} · ${esc(x.am)} · LINE: ${esc(x.lineName)}</small></div>
        <div><button class="btn ok" data-emp="${esc(x.emp)}" data-d="APPROVE">อนุมัติ</button>
        <button class="btn no" data-emp="${esc(x.emp)}" data-d="REJECT">ปฏิเสธ</button></div></div>`).join('') || '<p class="empty">ไม่มีคำขอค้าง</p>'}</div>`;
    box.querySelectorAll('button[data-emp]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await api('decide', { empCode: b.dataset.emp, decision: b.dataset.d }); loadPending(); }
      catch (e) { alert(say(e)); b.disabled = false; }
    });
  } catch (e) { box.innerHTML = `<p class="msg">${esc(say(e))}</p>`; }
}

function viewRegister(lineName) {
  app.innerHTML = `<div class="card single"><h1>ลงทะเบียนครั้งแรก</h1>
    <p>สวัสดีคุณ ${esc(lineName)} กรุณากรอกรหัสพนักงาน ระบบจะส่งให้ผู้ดูแลอนุมัติก่อนเข้าใช้งาน</p>
    <label for="emp">รหัสพนักงาน</label><input id="emp" inputmode="numeric" autocomplete="off" placeholder="เช่น 36208">
    <button class="btn primary" id="go">ส่งคำขอเข้าใช้งาน</button><div class="err" id="err" role="alert"></div></div>`;
  document.getElementById('go').onclick = async () => {
    const emp = document.getElementById('emp').value.trim(), err = document.getElementById('err');
    if (!emp) { err.textContent = 'กรุณากรอกรหัสพนักงาน'; return; }
    err.textContent = 'กำลังส่ง…';
    try { await api('register', { empCode: emp }); viewPending(); } catch (e) { err.textContent = say(e); }
  };
}
function viewPending() {
  app.innerHTML = `<div class="card single"><h1>รอการอนุมัติ</h1><p>ส่งคำขอแล้ว เมื่อผู้ดูแลอนุมัติ เปิดลิงก์นี้อีกครั้งเพื่อเข้าใช้งาน</p></div>`;
}
function viewMsg(title, text) {
  app.innerHTML = `<div class="card single"><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
}

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const [me, profile] = await Promise.all([api('me'), liff.getProfile().catch(() => null)]);
    if (me.state === 'UNREGISTERED') viewRegister(me.lineName);
    else if (me.state === 'PENDING') viewPending();
    else if (me.state === 'APPROVED') viewLobby(me, profile);
    else viewMsg('บัญชีถูกระงับ', 'กรุณาติดต่อผู้ดูแลระบบ');
  } catch (e) { viewMsg('เกิดข้อผิดพลาด', say(e)); }
})();
</script>
</body>
</html>
