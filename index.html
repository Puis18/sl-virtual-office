<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Virtual Office</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1E3365;--navy2:#14244A;--red:#9F1C33;--green:#126C3D;--ink:#121B2E;--sub:#3D4760;--muted:#5A6478;--line:#DCE1EA;--bg:#F3F5F9}
  *{box-sizing:border-box} body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:min(96vw,2000px);margin:0 auto;padding:0 16px}
  header{background:#fff;border-bottom:4px solid var(--red)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
  header img{height:30px;display:block}
  .who{display:flex;align-items:center;gap:10px}
  .who .t{display:flex;flex-direction:column;line-height:1.3;text-align:right}
  .who b{font-size:14px} .who small{font-size:12px;color:var(--muted)}
  .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
  .av img{width:100%;height:100%;object-fit:cover}
  .hero{background:var(--navy);color:#fff}
  .hero .wrap{padding-top:28px;padding-bottom:32px;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center}
  .hero .l{flex:999 1 420px;min-width:0}
  .hero small{color:#AEBBD6;font-size:13px} .hero h1{margin:6px 0 8px;font-size:28px;line-height:1.3}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
  .goal{flex:1 1 320px;min-width:0;background:#fff;color:var(--ink);border-radius:12px;padding:20px 22px}
  .goal .h{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:600}
  .goal .v{font-family:Inter,sans-serif;font-size:40px;font-weight:700;color:var(--navy);margin:8px 0}
  .bar{height:8px;border-radius:4px;background:#E3E8F0}
  .goal p{margin:10px 0 0;font-size:12px;color:var(--muted)}
  main.wrap{padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:28px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi span{font-size:13px;color:var(--sub)} .kpi b{display:block;font-family:Inter,sans-serif;font-size:24px;margin-top:4px;color:var(--muted)}
  .sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
  .sec-h h2{margin:0;font-size:20px;color:var(--navy);padding-left:12px;border-left:4px solid var(--red)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .dept{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border-radius:12px;min-height:150px;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line)}
  .dept.open{border:1.5px solid var(--navy);box-shadow:inset 0 4px 0 var(--green)}
  .dept.locked{background:#EEF1F5;border:1px dashed #AEB6C5;color:var(--muted)}
  .dept .top{display:flex;justify-content:space-between;align-items:center;width:100%}
  .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:#E3E8F0;color:var(--sub)}
  .open .ic{background:var(--navy);color:#fff}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;background:#E8ECF2;color:var(--sub)}
  .open .badge{background:#E3F1E8;color:#0C4F2C;font-weight:600}
  .locked .badge{background:transparent;border:1px solid #AEB6C5;color:#4F586B}
  .dept b{font-size:16px} .dept small{font-size:13px;color:var(--sub);line-height:1.55}
  .msg{margin:14px 0 0;padding:12px 16px;border:1px solid #C9D4E8;border-radius:10px;background:#EEF2F9;color:var(--navy);font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px}
  .card .hd{padding:14px 20px;border-bottom:1px solid #E6EAF1;display:flex;justify-content:space-between;align-items:center}
  .card .hd h2{margin:0;font-size:17px}
  .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #EEF1F5}
  .row small{display:block;color:var(--muted);font-size:13px}
  .btn{min-height:42px;padding:0 16px;border:none;border-radius:8px;font-weight:600}
  .ok{background:var(--green);color:#fff} .no{background:#E8ECF2;color:var(--ink)}
  .primary{background:var(--red);color:#fff;width:100%;min-height:48px;margin-top:12px}
  .empty{padding:16px 20px;color:var(--muted);font-size:14px;margin:0}
  .single{max-width:480px;margin:24px auto;padding:22px}
  .single h1{font-size:22px;margin:0 0 8px} .single p{color:var(--muted);line-height:1.6;margin:0 0 14px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;min-height:48px;padding:0 12px;border:1px solid #C5CED8;border-radius:8px;font:inherit;font-size:16px}
  .err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
  .skel{height:120px;border-radius:12px;background:linear-gradient(90deg,#E8ECF2,#F3F5F9,#E8ECF2);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .back{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;min-height:40px;padding:0 14px;margin-bottom:10px;font-size:14px}
  .days{display:flex;align-items:flex-end;gap:4px;height:160px;padding:16px 20px 8px;overflow-x:auto}
  .db{flex:1 0 14px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  
  .db span{font-size:10px;color:var(--muted)}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #EEF1F5;vertical-align:middle}
  td small{display:block;color:var(--muted);font-size:12px;max-width:min(260px,38vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n{text-align:right;font-family:Inter,sans-serif;white-space:nowrap}
  .pc{display:flex;align-items:center;gap:8px;min-width:120px}
  .mini{flex:1;height:6px;border-radius:3px;background:#E3E8F0;overflow:hidden}.mini i{display:block;height:6px}
  .pc span{font-family:Inter,sans-serif;font-size:13px;width:40px;text-align:right}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-top:14px;padding-bottom:0;border-bottom:1px solid var(--line)}
  .tabs button{background:transparent;border:none;padding:10px 14px;min-height:44px;font-size:15px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
  .tabs button[aria-selected=true]{color:var(--navy);font-weight:700;border-bottom-color:var(--red)}
  .stk{width:100%;display:flex;flex-direction:column;border-radius:3px 3px 0 0;overflow:hidden}.stk i{display:block;width:100%}
  .ios{background:var(--navy)}.and{background:#3E9A6A}.oth{background:#B4BCC9}
  .osbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#E3E8F0;flex:1}.osbar i{display:block;height:10px}
  .osc{display:flex;align-items:center;gap:8px;min-width:130px}.osc span{font-family:Inter,sans-serif;font-size:13px;width:40px;text-align:right}
  .lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .kpi .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  tr.click{cursor:pointer} tr.click:hover td{background:#F6F8FB}
  .ext{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 16px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:0;text-decoration:none;color:var(--ink)}
  .ext b{display:block;font-size:15px;color:var(--navy)} .ext small{display:block;font-size:12px;color:var(--muted)} .ext span:last-child{font-size:20px;color:var(--navy)}
  .search input{width:100%;min-height:46px;padding:0 14px;border:1px solid #C5CED8;border-radius:10px;font:inherit;font-size:16px;background:#fff}
  .frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 20px;align-items:end}
  .frm label{font-size:13px;font-weight:600;margin:0}.frm input,.frm select{margin-top:4px}
  select{min-height:42px;padding:0 8px;border:1px solid #C5CED8;border-radius:8px;font:inherit;font-size:14px;background:#fff;max-width:180px}
  .frm select{width:100%;max-width:none;min-height:48px;font-size:16px}
  td b{display:block;min-width:120px}
  .fbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
  .fbar input{flex:1 1 220px;min-height:44px;padding:0 12px;border:1px solid #C5CED8;border-radius:8px;font:inherit;font-size:16px;background:#fff}
  .fbar select{flex:0 1 auto;min-height:44px;max-width:240px;font-size:15px}
  footer{border-top:1px solid var(--line);background:#fff;font-size:12px;color:var(--muted)}
  footer .wrap{padding:14px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
  @media (max-width:560px){.hero h1{font-size:23px}.who .t{display:none}}

  /* ---- แถบเมนูซ้าย (คอม) + แถบล่าง (มือถือ) ---- */
  .shell{min-height:100vh}.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}.col #app{flex:1}
  aside{background:var(--navy);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-logo{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:6px}.sb-logo img{display:block;width:100%;height:auto}
  .sb-sub{font-size:12px;color:#AEBBD6;text-align:center;margin:0 0 10px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.12)}
  .sb-grp{font-size:11px;letter-spacing:.06em;color:#8E9CBC;margin:12px 10px 4px}
  .nv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;border-radius:10px;background:transparent;color:#DCE3F2;font-size:14px;text-align:left;min-height:42px}
  .nv i{width:28px;height:28px;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
  .nv:hover{background:rgba(255,255,255,.08)}.nv.on{background:#fff;color:var(--navy);font-weight:600}.nv.on i{background:var(--navy);color:#fff}
  .nv .tg{margin-left:auto;font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.12);color:#C7D0E3;white-space:nowrap}
  .nv.lk{opacity:.5}
  .sb-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid rgba(255,255,255,.12)}
  .sb-me .av{background:var(--red)}.sb-me b{display:block;font-size:14px}.sb-me small{display:block;font-size:11.5px;color:#AEBBD6}
  #mnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
  #mnav button{flex:1;background:none;border:none;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
  #mnav button b{font-size:17px;line-height:1.2}#mnav button.on{color:var(--navy);font-weight:700}
  #mnav[hidden],aside[hidden]{display:none}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:90vw}
  @media (min-width:900px){.shell.nav{display:grid;grid-template-columns:250px 1fr}.shell.nav header{display:none}#mnav{display:none}.shell.nav .back{display:none}}
  @media (max-width:899px){aside{display:none}body.has-nav{padding-bottom:70px}}

  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .qk{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;font:inherit;color:var(--ink)}
  .qk:hover{border-color:var(--navy)}.qk i{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700}
  .qk b{display:block;font-size:15px;color:var(--navy)}.qk small{display:block;font-size:12px;color:var(--muted)}
  .fi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;border:none;border-bottom:1px solid #EEF1F5;background:#fff;text-align:left;font:inherit;color:var(--ink)}
  .fi:hover{background:#F6F8FB}.fi span:nth-child(2){flex:1}.fi b{display:block;font-size:15px}.fi small{display:block;font-size:13px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.dot.red{background:var(--red)}.dot.green{background:var(--green)}.dot.amber{background:#C98A1B}
  @media (min-width:900px){.shell.nav .mobile-only{display:none}}
  /* ย่อแถบเมนู */
  .sb-tog{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px;background:rgba(255,255,255,.08);border:none;color:#C7D0E3;border-radius:8px;min-height:34px;font-size:12px}
  .sb-logo .sb-ic{display:none}.sbmini .sb-logo .sb-ic{display:block}.sbmini .sb-logo .sb-full{display:none}.dot{min-width:10px}.goal .v{font-size:34px}
  .shell.nav.sbmini{grid-template-columns:72px 1fr}
  .sbmini aside{padding:16px 10px}.sbmini .sb-logo{padding:6px}.sbmini .sb-full,.sbmini .sb-sub,.sbmini .sb-grp,.sbmini .nv .tx,.sbmini .nv .tg,.sbmini .sb-me div:last-child,.sbmini .sb-tog .tx{display:none}.sbmini .sb-ic{display:block}
  .sbmini .nv{justify-content:center;padding:8px 0}.sbmini .sb-me{justify-content:center;padding-left:0;padding-right:0}.sbmini .nv.lk i::after{content:'';}

  .nv em{display:none;font-style:normal}.sbmini .nv{flex-direction:column;gap:3px;min-height:56px}.sbmini .nv em{display:block;font-size:10.5px;line-height:1.2;text-align:center}
  .sbmini .nv.lk em::after{content:' 🔒';font-size:8px}.nv .tg svg{vertical-align:-1px}
  .nv i{width:30px;height:30px}#mnav button svg{margin-bottom:1px}
  .shell.nav.sbhov{grid-template-columns:72px 1fr}.sbhov aside{width:250px;z-index:60;box-shadow:8px 0 30px rgba(10,20,50,.25)}
  aside{transition:width .15s ease}
</style>
</head>
<body>
<div class="shell"><aside id="side" hidden></aside><div class="col">
<header><div class="wrap"><img src="logo.png" alt="S Leasing"><div class="who" id="who"></div></div></header>
<div id="app"><main class="wrap"><div class="skel"></div><div class="skel"></div></main></div>
<footer><div class="wrap"><span>S Leasing Virtual Office · เครื่องมือภายในทีม AM1 / AM2</span><span>ข้อมูลลูกค้าเป็นความลับ ห้ามเผยแพร่ภายนอก (PDPA)</span></div></footer>
</div></div><nav id="mnav" hidden></nav>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012282702-qtqjFxgj';
const API_URL = 'https://script.google.com/macros/s/AKfycbyXqPr50rBusW9Z-t0P4hk9ZshyvW_sA4vAn4IfmdqPiHizOpofBO3-7dSOwkKMQbpa/exec';

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// โทเคนหมดอายุ (มักเกิดในเบราว์เซอร์คอมพิวเตอร์) → ออกจากระบบ แล้วให้ผู้ใช้กดเข้าสู่ระบบเอง
function signedOut() {
  try { liff.logout(); } catch (e) {}
  document.getElementById('who').innerHTML = '';
  app.innerHTML = `<div class="card single"><h1>ออกจากระบบแล้ว</h1>
    <p>การเข้าสู่ระบบหมดอายุ ระบบจึงออกจากระบบให้อัตโนมัติเพื่อความปลอดภัย</p>
    <button class="btn primary" id="relogin">เข้าสู่ระบบด้วย LINE อีกครั้ง</button></div>`;
  document.getElementById('relogin').onclick = () => liff.login({ redirectUri: location.origin + location.pathname });
  return new Promise(() => {});
}
async function api(action, extra = {}) {
  const tok = liff.getDecodedIDToken && liff.getDecodedIDToken();
  if (tok && tok.exp * 1000 < Date.now() + 60000) return signedOut();
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, extra)) });
  const j = await r.json();
  if (!j.ok && j.error === 'INVALID_TOKEN') return signedOut();
  if (!j.ok) throw new Error(j.error);
  return j;
}
const MSG = {
  EMP_NOT_FOUND:'ไม่พบรหัสพนักงานนี้ กรุณาตรวจสอบอีกครั้ง', EMP_ALREADY_LINKED:'รหัสนี้ถูกผูกกับ LINE อื่นแล้ว กรุณาติดต่อผู้ดูแลระบบ',
  ALREADY_LINKED:'LINE นี้ลงทะเบียนไว้แล้ว', INVALID_TOKEN:'การยืนยันตัวตนหมดอายุ กรุณาปิดหน้านี้แล้วเปิดลิงก์ใหม่อีกครั้ง', FORBIDDEN:'คุณไม่มีสิทธิ์ทำรายการนี้',
  DASH_NOT_READY:'Dashboard ยังไม่พร้อม (ระบบกำลังสร้างข้อมูลของวันนี้) ลองใหม่ภายหลัง'
};
const say = e => MSG[e.message] || ('เกิดข้อผิดพลาด: ' + e.message);

/* ---------- ระดับสิทธิ์: ใช้สิทธิ์ที่กว้างที่สุดที่คนนั้นมี ---------- */
const RANK = { SELF:1, TEAM:2, HUB:3, AM:4, ALL:5 };
const ROLE_TH = { CK:'CK', BK:'BK', AG:'AG', TM:'TM', HRM:'Hub RM', AM:'AM', DIR:'ผู้อำนวยการ' };
function roleLabel(r) {
  const where = r.scope==='ALL' ? 'ทั้งหมด' : r.scope==='AM' ? 'ทุกทีมใน '+r.am : r.scope==='HUB' ? 'ทุกทีมใน '+r.hub
              : r.scope==='TEAM' ? 'ทีม '+r.team : 'ข้อมูลของตัวเอง';
  return (ROLE_TH[r.role] || r.role) + ' · ' + where;
}


/* ---------- ไอคอนประจำฝ่าย (เส้นแบบ Lucide) ---------- */
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  sales:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  od:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',

  });
  const mg = document.getElementById('mgr'); if (mg) mg.onclick = () => viewStaff();
  const sm = document.getElementById('sum'); if (sm) sm.onclick = () => go('sales');
  const qd = document.getElementById('qDash'); if (qd) qd.onclick = () => openDash(qd);

let NAV_ON = '';
function deptState(i) { const d = DEPTS[i], ok = RANK[topScope()] >= RANK[d.min]; return !ok ? 'lock' : d.phase === 1 ? 'open' : 'soon'; }
function toast(t) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2800); }
function go(key) {
  if (key === 'home') return viewLobby(ME, PROFILE);
  if (key === 'staff') return viewStaff();
  if (key === 'sales') return SALES ? viewSales() : (toast('กำลังโหลดยอดขาย…'), loadSales(topScope()).then(() => viewSales()));
  const i = DEPT_KEY.indexOf(key), st = deptState(i), d = DEPTS[i];
  toast(st === 'lock' ? d.name + ' ไม่อยู่ในสิทธิ์ของตำแหน่งคุณ' : st === 'soon' ? d.name + ' จะเปิดใช้ในเฟส 2' : d.name + ' กำลังสร้าง จะเปิดให้ใช้เร็ว ๆ นี้');
}
function renderNav(active) {
  NAV_ON = active;
  const side = document.getElementById('side'), mn = document.getElementById('mnav');
  const tag = st => st === 'soon' ? '<span class="tg">เฟส 2</span>' : st === 'lock' ? `<span class="tg">${ico('lock', 12)}</span>` : '';

    ${canManage() ? `<div class="sb-grp">จัดการ</div><button class="nv" data-k="staff" title="รายชื่อพนักงาน"><i>${ico('staff')}</i><span class="tx">รายชื่อพนักงาน</span><em>พนักงาน</em></button>` : ''}
    <div class="sb-me"><div class="av">${PROFILE && PROFILE.pictureUrl ? `<img src="${esc(PROFILE.pictureUrl)}" alt="">` : esc(String(ME.nick || ME.name).charAt(0))}</div>
      <div><b>${esc(name)}</b><small>${esc(ME.roles.map(roleLabel).join(' / '))}</small></div></div>`;
  const items = [['home', 'หน้าแรก'], ['sales', 'ฝ่ายขาย'], ['od', 'ติดตามหนี้']].concat(canManage() ? [['staff', 'พนักงาน']] : []);
  mn.innerHTML = items.map(([k, l]) => `<button data-k="${k}">${ico(k, 22)}${l}</button>`).join('');

/* ================= ฝ่ายขาย ================= */
const nf = n => Number(n || 0).toLocaleString('th-TH');
const mb = n => (Number(n || 0) / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' ลบ.';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const thDay = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '—';
const thMonth = m => m ? new Date(m + '-01T00:00:00').toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }) : '';
const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };

async function loadSales(top) {
  try {
    SALES = SALES || await api('sales');
    const s = scoped(SALES), p = pct(s.mtd.apps, s.target);
    const hf = document.getElementById('hfilter');
    if (hf && SALES.scope !== 'SELF') { hf.innerHTML = filterBar('', true); bindSearch(); }
    set('gv', nf(s.mtd.apps) + ' / ' + nf(s.target) + ' เคส');
    const gb = document.getElementById('gb'); if (gb) gb.style.width = Math.min(p, 100) + '%';
    set('gp', `${p}% ของเป้า ${thMonth(s.month)} · ข้อมูลถึง ${thDay(s.latest)}`);
    const day = +String(s.latest || '').slice(8) || 1, dim = new Date(+s.month.slice(0, 4), +s.month.slice(5, 7), 0).getDate();
    const paceT = Math.round(s.target * day / dim), pace = pct(s.mtd.apps, paceT);
    const days = s.daily.map(d => d[1] + d[2] + d[3]), avg = days.length > 1 ? days.slice(0, -1).reduce((x, y) => x + y, 0) / (days.length - 1) : 0;
    const diff = avg ? Math.round((s.today.apps - avg) / avg * 100) : 0;
    set('kl0', 'ผลงานวันที่ ' + thDay(s.latest) + ' (เมื่อวาน)'); set('k0', nf(s.today.apps));
    set('ks0', avg ? (diff >= 0 ? '▲ ' : '▼ ') + Math.abs(diff) + '% เทียบค่าเฉลี่ยเดือนนี้' : '');
    set('k1', pace + '%'); set('ks1', `ควรได้ ${nf(paceT)} ณ วันที่ ${day} · ได้ ${nf(s.mtd.apps)}`);
    set('k2', pctTxt(s.mtd.ios, s.mtd.apps)); set('ks2', `iOS ${nf(s.mtd.ios)} · Android ${nf(s.mtd.and || s.mtd.android || 0)}`);
    // ข้อมูลเป็น T-1 เสมอ: "วันล่าสุด" = ผลงานเมื่อวานที่ดึงตอนเช้า
    const items = [], isAll = topScope() === 'ALL', dt = s.latest;
    const ea = (s.teams || []).filter(t => t.target);
    const shift = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
    const dayTot = Object.fromEntries(s.daily.map(d => [d[0], d[1] + d[2] + d[3]]));
    const groupTxt = list => { if (!isAll || list.length <= 6) return list.slice(0, 6).map(t => t.code + (t.p != null ? ` (${t.p}%)` : '')).join(' · ') + (list.length > 6 ? ` และอีก ${list.length - 6} ทีม` : '');
      const g = {}; list.forEach(t => { g[t.am] = (g[t.am] || 0) + 1; }); return Object.entries(g).sort((x, y) => y[1] - x[1]).map(([k, n]) => `${k} ${n} ทีม`).join(' · '); };
    // 1) ทีม EA ที่ยอดสะสมต่ำกว่า 80% ของเป้าตามวัน
    const low = ea.map(t => ({ ...t, p: pct(t.apps, Math.round(t.target * day / dim)) })).filter(t => t.p < 80).sort((x, y) => x.p - y.p);
    if (low.length) items.push(['red', `${low.length} ทีมต่ำกว่า 80% ของเป้าตามวัน`, groupTxt(low), 'people']);
    // 2) เมื่อวานเทียบวันเดียวกันของสัปดาห์ก่อน (ตัดผลของวันหยุดสุดสัปดาห์)
    const wk = dayTot[shift(dt, -7)];
    if (wk && dayTot[dt] != null) { const d = Math.round((dayTot[dt] - wk) / wk * 100);
      if (d <= -20) items.push(['red', `ยอดวันที่ ${thDay(dt)} ลดลง ${Math.abs(d)}% จากวันเดียวกันสัปดาห์ก่อน`, `${nf(dayTot[dt])} เคส เทียบ ${nf(wk)} เคส (${thDay(shift(dt, -7))})`, 'overview']);
      else if (d >= 20) items.push(['green', `ยอดวันที่ ${thDay(dt)} เพิ่มขึ้น ${d}% จากวันเดียวกันสัปดาห์ก่อน`, `${nf(dayTot[dt])} เคส เทียบ ${nf(wk)} เคส`, 'overview']); }
    // 3) ทีมที่ปกติมีเคส แต่เมื่อวานไม่มีเลย (ข้ามถ้าเมื่อวานยอดรวมต่ำผิดปกติ เช่นวันหยุด)
    const avgAll = days.length ? days.reduce((x, y) => x + y, 0) / days.length : 0;
    if (dayTot[dt] >= avgAll * 0.5) { const zero = ea.filter(t => t.apps >= day && !t.today);
      if (zero.length) items.push(['amber', `${zero.length} ทีมไม่มีเคสเลยในวันที่ ${thDay(dt)}`, groupTxt(zero), 'people']); }
    // 4) ร้านที่เคยส่งเคส แต่หยุดส่ง 7 วันขึ้นไป
    const st = (s.stalled || []).filter(x => inFilter(x.team));
    if (st.length) items.push(['amber', `${st.length} ร้านหยุดส่งเคส 7 วันขึ้นไป`, st.slice(0, 3).map(x => `${dShort(x.shop)} (${x.team} · ล่าสุด ${thDay(x.last)})`).join(' · '), 'shops']);
    // 5) พนักงานขายที่ยังไม่มีเคสเดือนนี้
    const idle = (s.idle || []).filter(x => inFilter(x.team));
    if (idle.length) items.push(['amber', `พนักงาน ${idle.length} คนยังไม่มีเคสเดือนนี้`, idle.slice(0, 4).map(x => `${x.name} (${x.team})`).join(' · ') + (idle.length > 4 ? ' …' : ''), 'people']);
    // 6) ข่าวดี: ทีมที่ทะลุเป้าทั้งเดือนแล้ว และภาพรวมเป็นไปตามเป้า
    const done = ea.filter(t => t.apps >= t.target);
    if (done.length) items.push(['green', `${done.length} ทีมทำยอดถึงเป้าทั้งเดือนแล้ว`, groupTxt(done), 'people']);
    if (pace >= 100) items.push(['green', `ยอดสะสมเป็นไปตามเป้า (${pace}% ของเป้าตามวัน)`, 'รักษาระดับนี้ต่อไป', 'overview']);
    const f = document.getElementById('focus');
    if (f) { f.innerHTML = items.length ? items.map(([c, t, d, tab]) => `<button class="fi" data-tab="${tab}"><i class="dot ${c}"></i><span><b>${esc(t)}</b><small>${esc(d)}</small></span><span aria-hidden="true">→</span></button>`).join('')
        : '<p class="empty">ไม่มีเรื่องเร่งด่วน ทุกอย่างเป็นไปตามเป้า 👍</p>';

// คำนวณตัวเลขด้านบนใหม่ตามตัวกรอง AM / Hub / ทีม (ใช้ยอดรายทีม + รายวันรายทีมจากหลังบ้าน)
function scoped(S) {
  if (!S || S.scope === 'SELF' || (!SALES_AM && !SALES_HUB && !SALES_TEAM)) return S;
  const teams = S.teams.filter(t => inFilter(t.code)), sum = k => teams.reduce((a, t) => a + (t[k] || 0), 0);
  const byDay = {};
  (S.td || []).forEach(([d, c, i, a, o]) => { if (!inFilter(c)) return; const x = byDay[d] = byDay[d] || [d, 0, 0, 0]; x[1] += i; x[2] += a; x[3] += o; });
  return Object.assign({}, S, {
    teams, target: teams.filter(t => t.apps > 0).length * 500,
    mtd: { apps: sum('apps'), amt: sum('amt'), ios: sum('ios'), android: sum('android'), other: sum('other'), emp: sum('emp'), dlr: sum('dlr'), mo: sum('mo'), ins: sum('ins'), staffN: sum('staffN') },
    today: { apps: sum('today'), amt: sum('tamt') },
    daily: S.td ? Object.keys(byDay).sort().map(d => byDay[d]) : S.daily,
    scope: [SALES_AM, SALES_HUB, SALES_TEAM].filter(Boolean).join(' · ') + ` (${teams.length} ทีม)`
  });
}

// เจาะลงทีละชั้นแบบ Dashboard Daily: ทั้งหมด → AM → Hub → ทีม → พนักงาน
function drill(s) {
  if (s.scope === 'SELF') return '';
  if (SALES_TEAM) {
    const st = sortBy(s.staff.filter(x => x.team === SALES_TEAM));
    return staffTable(st, 'พนักงานทีม ' + esc(SALES_TEAM));
  }
  const group = (key, label) => {
    const g = {};
    s.teams.forEach(t => { const k = t[key] || '—'; const o = g[k] = g[k] || { k, n: 0, apps: 0, today: 0, ios: 0, target: 0 };
      o.n++; o.apps += t.apps; o.today += t.today || 0; o.ios += t.ios || 0; o.target += t.target || 0; });
    const rows = Object.values(g).sort((a, b) => b.apps - a.apps).map(o => `<tr class="click" data-${key}="${esc(o.k)}"><td><b>${esc(o.k)}</b><small>${o.n} ทีม</small></td>
      <td class="n">${nf(o.today)}</td><td class="n">${nf(o.apps)}</td><td class="n">${pctTxt(o.ios, o.apps)}</td>
      <td>${o.target ? `<div class="pc"><div class="mini"><i style="width:${Math.min(100, pct(o.apps, o.target))}%;background:${o.apps >= o.target ? 'var(--green)' : 'var(--navy)'}"></i></div><span>${pct(o.apps, o.target)}%</span></div>` : '<small>ไม่มีเป้า (MC)</small>'}</td></tr>`).join('');
    return `<section class="card"><div class="hd"><h2>${label} (กดเพื่อเจาะดู)</h2></div><div class="tw"><table><thead><tr><th>${key === 'am' ? 'AM' : 'Hub'}</th><th class="n">วันล่าสุด</th><th class="n">สะสม</th><th class="n">iOS</th><th>เทียบเป้า</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  };
  if (SALES_HUB) return teamTable(sortBy(s.teams), `ทีมใน ${esc(SALES_HUB)} (กดที่ทีมเพื่อดูพนักงาน)`);
  if (SALES_AM) return group('hub', 'Hub ใน ' + esc(SALES_AM)) + teamTable(sortBy(s.teams), `ทีมใน ${esc(SALES_AM)}`);
  const ams = new Set(s.teams.map(t => t.am));
  return (ams.size > 1 ? group('am', 'สรุปราย AM') : '') + (s.teams.length ? teamTable(s.teams.slice(0, 10), 'ทีมสูงสุด 10 อันดับ (กดที่ทีมเพื่อดูพนักงาน)') : '');
}

let SALES_DEALER = '', SALES_SHOWROOM = '';
const dShort = d => String(d || '').replace(/\s*\((No )?VAT\)$/, '');
const vatTag = d => /\(No VAT\)$/.test(d) ? 'No VAT' : /\(VAT\)$/.test(d) ? 'VAT' : '';
const mcTxt = (ins, mo) => mo ? (ins / mo * 100).toFixed(1) + '%' : '—';

function tabShops(s) {
  const base = s.shops.filter(x => inFilter(x.team) && qMatch(x.dealer, x.showroom, x.team));
  const srOpts = [...new Set(base.filter(x => !SALES_DEALER || x.dealer === SALES_DEALER).map(x => x.showroom).filter(Boolean))].sort();
  if (SALES_SHOWROOM && !srOpts.includes(SALES_SHOWROOM)) SALES_SHOWROOM = '';
  const rows0 = base.filter(x => (!SALES_DEALER || x.dealer === SALES_DEALER) && (!SALES_SHOWROOM || x.showroom === SALES_SHOWROOM));

    const o = g[k] = g[k] || { k, dealer: x.dealer, apps: 0, today: 0, amt: 0, ios: 0, android: 0, other: 0, mo: 0, ins: 0, teams: new Set(), srs: new Set() };
    ['apps', 'today', 'amt', 'ios', 'android', 'other', 'mo', 'ins'].forEach(f => { o[f] += x[f] || 0; }); o.teams.add(x.team); o.srs.add(x.showroom); });

    <td class="n">${nf(o.today)}</td><td class="n">${nf(o.apps)}</td><td class="n">${mb(o.amt)}</td><td class="n">${mcTxt(o.ins, o.mo)}</td>

  <section class="card"><div class="hd"><h2>${SALES_DEALER ? 'โชว์รูมของ ' + esc(dShort(SALES_DEALER)) + (vatTag(SALES_DEALER) ? ' (' + vatTag(SALES_DEALER) + ')' : '') : 'ดีลเลอร์ทั้งหมด ' + nf(list.length) + ' ร้าน'} · ${nf(tot)} เคส</h2>${SALES_DEALER ? '' : '<small style="color:var(--muted)">กดชื่อดีลเลอร์เพื่อดูรายโชว์รูม</small>'}</div><div class="tw"><table>
    <thead><tr><th>#</th><th>${bySr ? 'โชว์รูม' : 'ดีลเลอร์'}</th><th class="n">วันล่าสุด</th><th class="n">สะสม</th><th class="n">ยอดจัด</th><th class="n">% Mobile Care</th><th>iOS</th></tr></thead>

}

async function openDash(btn) {
  const msg = t => { const m = document.getElementById('dashmsg'); if (m) m.textContent = t;
    const d = document.getElementById('dmsg'); if (d && !m) d.innerHTML = `<p class="msg" role="status">${esc(t)}</p>`; };
  if (btn) btn.disabled = true;
  try {
    msg('กำลังตรวจสิทธิ์…');
    const k = await api('dashKeys');
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const open1 = async (file, key) => {
      const r = await fetch(DASH_BASE + file + '?v=' + k.build); if (!r.ok) throw new Error('โหลดไฟล์ไม่สำเร็จ (' + r.status + ')');
      const buf = new Uint8Array(await r.arrayBuffer());
      const ck = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, ck, buf.slice(12));
      return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
    };
    const codes = Object.keys(k.teams);   // __others = ทุกทีมนอก AM1/AM2 (เฉพาะผู้อำนวยการ)
    let done = 0;
    msg(`กำลังโหลดข้อมูล ${codes.length} ทีม…`);
    const [common, ...parts] = await Promise.all([open1('common.bin', k.common),
      ...codes.map(c => open1(c === '__others' ? 'others.bin' : 't_' + c + '.bin', k.teams[c]).then(x => { msg(`กำลังโหลดข้อมูล ${++done}/${codes.length} ทีม…`); return x; }))]);
    const records = [].concat(...parts);
    const keep = (list, f) => { const set = new Set(records.map(r => r[f])); return (list || []).filter(x => set.has(x)); };
    // รายการตัวเลือกให้เหลือเฉพาะที่อยู่ในสิทธิ์
    common.teams = keep(common.teams, 'team_name_en');
    common.marketings = keep(common.marketings, 'marketing_fullname');
    common.dealers = keep(common.dealers, 'dealer_name_en');
    common.showrooms = keep(common.showrooms, 'showroom_name_en');
    common.records = records;
    msg('กำลังเปิด Dashboard…');
    const shell = await (await fetch(DASH_BASE + 'shell.html?v=' + k.build)).text();
    window.__VO_PAYLOAD__ = common;
    document.open(); document.write(shell); document.close();
  } catch (e) { msg(say(e)); if (btn) btn.disabled = false; }
}

/* ================= ค้นหา + จัดการรายชื่อ (Hub RM ขึ้นไป) ================= */
let SALES_Q = '', SALES_AM = '', SALES_HUB = '', SALES_SORT = 'apps';
const topScope = () => ME.roles.reduce((a, r) => RANK[r.scope] > RANK[a] ? r.scope : a, 'SELF');
const canManage = () => RANK[topScope()] >= RANK.HUB;
const qMatch = (...xs) => !SALES_Q || xs.some(x => String(x || '').toLowerCase().includes(SALES_Q.toLowerCase()));
const teamOf = code => (SALES.teams || []).find(t => t.code === code) || {};
// ผ่านตัวกรอง AM / HUB / ทีม หรือไม่
const inFilter = code => { const t = teamOf(code);
  return (!SALES_TEAM || code === SALES_TEAM) && (!SALES_AM || t.am === SALES_AM) && (!SALES_HUB || t.hub === SALES_HUB); };
const SORTS = { apps: ['สะสมมากสุด', x => x.apps], today: ['วันล่าสุดมากสุด', x => x.today], ios: ['iOS มากสุด', x => x.ios],
  android: ['Android มากสุด', x => x.android], iosPct: ['% iOS สูงสุด', x => x.apps ? x.ios / x.apps : 0], andPct: ['% Android สูงสุด', x => x.apps ? x.android / x.apps : 0] };
const sortBy = list => list.slice().sort((a, b) => SORTS[SALES_SORT][1](b) - SORTS[SALES_SORT][1](a));
function filterBar(ph, compact) {
  const s = SALES; if (s.scope === 'SELF') return '';
  const uniq = k => [...new Set(s.teams.map(t => t[k]).filter(Boolean))].sort();
  const opt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label || v)}</option>`;
  const teams = s.teams.filter(t => (!SALES_AM || t.am === SALES_AM) && (!SALES_HUB || t.hub === SALES_HUB)).sort((a, b) => a.code.localeCompare(b.code));
  const ams = uniq('am');
  const hubs = [...new Set(s.teams.filter(t => !SALES_AM || t.am === SALES_AM).map(t => t.hub).filter(Boolean))].sort();   // HUB เฉพาะใน AM ที่เลือก
  return `<div class="fbar">
    ${!compact && canManage() ? `<input id="q" type="search" placeholder="${ph}" value="${esc(SALES_Q)}" aria-label="ค้นหา">` : ''}
    ${ams.length > 1 ? `<select id="fam" aria-label="AM">${opt('', SALES_AM, 'ทุก AM')}${ams.map(a => opt(a, SALES_AM)).join('')}</select>` : ''}
    ${hubs.length > 1 ? `<select id="fhub" aria-label="HUB">${opt('', SALES_HUB, 'ทุก HUB')}${hubs.map(h => opt(h, SALES_HUB)).join('')}</select>` : ''}
    ${teams.length > 1 ? `<select id="fteam" aria-label="ทีม">${opt('', SALES_TEAM, 'ทุกทีม')}${teams.map(t => opt(t.code, SALES_TEAM, t.code + ' · ' + t.name)).join('')}</select>` : ''}
    ${compact ? '' : `<select id="fsort" aria-label="เรียงตาม">${Object.entries(SORTS).map(([k, v]) => opt(k, SALES_SORT, 'เรียง: ' + v[0])).join('')}</select>`}
    ${SALES_Q || SALES_AM || SALES_HUB || SALES_TEAM || SALES_DEALER || SALES_SHOWROOM ? '<button class="btn no" id="freset">ล้างตัวกรอง</button>' : ''}
  </div>`;
}
let RERENDER = () => viewSales();
function bindSearch() {
  const q = document.getElementById('q');
  if (q) q.oninput = () => { SALES_Q = q.value.trim(); const pos = q.selectionStart; RERENDER(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onchange = () => { f(el.value); RERENDER(); }; };
  on('fam', v => { SALES_AM = v; SALES_HUB = ''; SALES_TEAM = ''; });
  on('fhub', v => { SALES_HUB = v; SALES_TEAM = ''; });
  on('fteam', v => { SALES_TEAM = v; });
  on('fsort', v => { SALES_SORT = v; });
  const r = document.getElementById('freset'); if (r) r.onclick = () => { SALES_Q = SALES_AM = SALES_HUB = SALES_TEAM = SALES_DEALER = SALES_SHOWROOM = ''; RERENDER(); };
}

let STAFF;
async function viewStaff(msg) {
  window.scrollTo(0, 0); renderNav('staff');
  app.innerHTML = `<section class="hero"><div class="wrap"><div class="l"><button class="back" id="back">← กลับล็อบบี้</button>
    <h1>จัดการรายชื่อพนักงาน</h1><small>เพิ่มคนใหม่ · ย้ายทีม/เปลี่ยนตำแหน่ง · ปิดการใช้งาน — ทุกการแก้ไขถูกบันทึกในชีต AuditLog</small></div></div></section>
    <main class="wrap" id="sm"><div class="skel"></div></main>`;
  document.getElementById('back').onclick = () => viewLobby(ME, PROFILE);
  try { STAFF = await api('staffList'); } catch (e) { document.getElementById('sm').innerHTML = `<p class="msg">${esc(say(e))}</p>`; return; }
  renderStaff(msg);
}
function renderStaff(msg) {
  const d = STAFF, q = (document.getElementById('sq') || {}).value || '';
  const teamOpt = sel => d.teams.map(t => `<option value="${esc(t.code)}"${t.code === sel ? ' selected' : ''}>${esc(t.code)} · ${esc(t.name)}</option>`).join('');
  const roleOpt = sel => d.roles.map(r => `<option${r === sel ? ' selected' : ''}>${r}</option>`).join('');
  const list = d.staff.filter(s => !q || [s.emp, s.name, s.nick, s.team].some(x => String(x).toLowerCase().includes(q.toLowerCase())));
  document.getElementById('sm').innerHTML = `
    ${msg ? `<p class="msg" role="status">${esc(msg)}</p>` : ''}
    <section class="card"><div class="hd"><h2>เพิ่มพนักงานใหม่</h2></div>
      <form class="frm" id="add">
        <label>รหัสพนักงาน<input name="emp" inputmode="numeric" required></label>
        <label>ชื่อ-นามสกุล<input name="name" required></label>
        <label>ชื่อเล่น<input name="nick"></label>
        <label>ตำแหน่ง<select name="role">${roleOpt('CK')}</select></label>
        <label>ทีม<select name="team">${teamOpt('')}</select></label>
        <button class="btn ok" type="submit">เพิ่ม</button><div class="err" id="adderr" role="alert"></div>
      </form></section>
    <section class="card"><div class="hd"><h2>พนักงานในทีมที่คุณดูแล (${list.length})</h2></div>
      <div class="search" style="padding:12px 20px 0"><input id="sq" type="search" placeholder="ค้นหารหัส ชื่อ ชื่อเล่น หรือทีม" value="${esc(q)}"></div>
      <div class="tw"><table><thead><tr><th>พนักงาน</th><th>ตำแหน่ง</th><th>ทีม</th><th></th></tr></thead><tbody>
      ${list.map(s => `<tr data-emp="${esc(s.emp)}"><td><b>${esc(s.name)}</b><small>${esc(s.emp)}${s.nick ? ' · ' + esc(s.nick) : ''} · ${s.access === 'APPROVED' ? 'เข้าระบบแล้ว' : s.linked ? 'รออนุมัติ' : 'ยังไม่ลงทะเบียน'}</small></td>
        <td><select class="r">${roleOpt(s.role)}</select></td><td><select class="t">${teamOpt(s.team)}</select></td>
        <td style="white-space:nowrap"><button class="btn ok sv">บันทึก</button> <button class="btn no rm">ปิด</button></td></tr>`).join('') || '<tr><td colspan="4" class="empty">ไม่พบรายชื่อ</td></tr>'}
      </tbody></table></div></section>`;
  const sq = document.getElementById('sq');
  sq.oninput = () => { const p = sq.selectionStart; renderStaff(); const n = document.getElementById('sq'); n.focus(); n.setSelectionRange(p, p); };
  document.getElementById('add').onsubmit = async ev => {
    ev.preventDefault(); const f = new FormData(ev.target), err = document.getElementById('adderr');
    if (!f.get('emp').trim() || !f.get('name').trim()) { err.textContent = 'กรุณากรอกรหัสและชื่อ'; return; }
    err.textContent = 'กำลังบันทึก…';
    try { await api('staffSave', { op: 'ADD', emp: f.get('emp').trim(), name: f.get('name'), nick: f.get('nick'), role: f.get('role'), team: f.get('team') });
      viewStaff('เพิ่ม ' + f.get('name') + ' แล้ว — ส่งลิงก์ LINE ให้ลงทะเบียน แล้วอนุมัติได้เลย'); }
    catch (e) { err.textContent = say(e); }
  };
  document.querySelectorAll('tr[data-emp]').forEach(tr => {
    const emp = tr.dataset.emp, s = d.staff.find(x => x.emp === emp);
    tr.querySelector('.sv').onclick = async b => {
      const role = tr.querySelector('.r').value, team = tr.querySelector('.t').value;
      if (role === s.role && team === s.team) return;
      b.target.disabled = true;
      try { await api('staffSave', { op: 'MOVE', emp, role, team }); viewStaff(`${s.name}: ${s.role} ${s.team} → ${role} ${team}`); }
      catch (e) { alert(say(e)); b.target.disabled = false; }
    };
    tr.querySelector('.rm').onclick = async b => {
      if (!confirm(`ปิดการใช้งาน ${s.name}? (คนนี้จะเข้าระบบไม่ได้ และหายจากรายชื่อทีม)`)) return;
      b.target.disabled = true;
      try { await api('staffSave', { op: 'REMOVE', emp }); viewStaff('ปิดการใช้งาน ' + s.name + ' แล้ว'); }
      catch (e) { alert(say(e)); b.target.disabled = false; }
    };
  });
}

  const box = document.getElementById('admin');
  try {
    const { list } = await api('pending');
    box.innerHTML = `<div class="card"><div class="hd"><h2>คำขอรออนุมัติ (${list.length})</h2></div>
      ${list.length ? '<p class="empty">ตรวจว่าชื่อ LINE ตรงกับเจ้าของรหัสพนักงานก่อนกดอนุมัติ</p>' : ''}
      ${list.map(x => `<div class="row"><div><b>${esc(x.name)}</b> (${esc(x.nick)})
        <small>${esc(x.emp)} · ${esc(x.pos)} · ${esc(x.am)} · LINE: ${esc(x.lineName)}</small></div>
        <div><button class="btn ok" data-emp="${esc(x.emp)}" data-d="APPROVE">อนุมัติ</button>
        <button class="btn no" data-emp="${esc(x.emp)}" data-d="REJECT">ปฏิเสธ</button></div></div>`).join('') || '<p class="empty">ไม่มีคำขอค้าง</p>'}</div>`;
    box.querySelectorAll('button[data-emp]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await api('decide', { empCode: b.dataset.emp, decision: b.dataset.d }); loadPending(); }
      catch (e) { alert(say(e)); b.disabled = false; }
    });
  } catch (e) { box.innerHTML = `<p class="msg">${esc(say(e))}</p>`; }
}

function viewRegister(lineName) {
  app.innerHTML = `<div class="card single"><h1>ลงทะเบียนครั้งแรก</h1>
    <p>สวัสดีคุณ ${esc(lineName)} กรุณากรอกรหัสพนักงาน ระบบจะส่งให้ผู้ดูแลอนุมัติก่อนเข้าใช้งาน</p>
    <label for="emp">รหัสพนักงาน</label><input id="emp" inputmode="numeric" autocomplete="off" placeholder="เช่น 36208">
    <button class="btn primary" id="go">ส่งคำขอเข้าใช้งาน</button><div class="err" id="err" role="alert"></div></div>`;
  document.getElementById('go').onclick = async () => {
    const emp = document.getElementById('emp').value.trim(), err = document.getElementById('err');
    if (!emp) { err.textContent = 'กรุณากรอกรหัสพนักงาน'; return; }
    err.textContent = 'กำลังส่ง…';
    try { await api('register', { empCode: emp }); viewPending(); } catch (e) { err.textContent = say(e); }
  };
}
function viewPending() {
  app.innerHTML = `<div class="card single"><h1>รอการอนุมัติ</h1><p>ส่งคำขอแล้ว เมื่อผู้ดูแลอนุมัติ เปิดลิงก์นี้อีกครั้งเพื่อเข้าใช้งาน</p></div>`;
}
function viewMsg(title, text) {
  app.innerHTML = `<div class="card single"><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
}

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const [me, profile] = await Promise.all([api('me'), liff.getProfile().catch(() => null)]);
    if (me.state === 'UNREGISTERED') viewRegister(me.lineName);
    else if (me.state === 'PENDING') viewPending();
    else if (me.state === 'APPROVED') viewLobby(me, profile);
    else viewMsg('บัญชีถูกระงับ', 'กรุณาติดต่อผู้ดูแลระบบ');
  } catch (e) { viewMsg('เกิดข้อผิดพลาด', say(e)); }
})();
